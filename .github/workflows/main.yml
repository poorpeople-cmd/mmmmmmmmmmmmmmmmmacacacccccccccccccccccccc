
name: StreamGuard - OK.ru FFmpeg Relay

on:
  workflow_dispatch:
    inputs:
      target_urls:
        description: 'Authorized DIRECT media URLs (m3u8, MP4 or RTMP); separate multiple URLs with |. Leave blank to use SOURCE_URLS secret.'
        required: false
        type: string
        default: ''

      okru_stream_channel:
        description: 'Choose the channel ID from STREAM_KEYS in stream.js'
        required: true
        type: string
        default: '1'

      stream_quality:
        description: 'Encoding resolution'
        required: true
        type: choice
        options:
          - 360p
          - 480p
          - 720p
          - 1080p
        default: 720p

      custom_duration:
        description: '30m, 1h 10m, or 24/7 (one GitHub run is capped at 330 minutes)'
        required: true
        type: string
        default: '30m'

permissions:
  contents: read

concurrency:
  group: streamguard-${{ github.repository }}-${{ inputs.okru_stream_channel }}
  cancel-in-progress: false

jobs:
  stream:
    name: FFmpeg StreamGuard Relay
    runs-on: ubuntu-24.04
    timeout-minutes: 345

    env:
      OKRU_STREAM_ID: ${{ inputs.okru_stream_channel }}
      STREAM_QUALITY: ${{ inputs.stream_quality }}
      CUSTOM_DURATION: ${{ inputs.custom_duration }}

      MAX_RUN_MINUTES: '330'
      STARTUP_GRACE_SECONDS: '45'
      STALL_SECONDS: '30'
      HEALTH_PORT: '0'
      VOD_PACE: 'OFF'

      # Inputs take precedence. To hide private media URLs,
      # use the SOURCE_URLS repository secret.
      SOURCE_URLS: ${{ inputs.target_urls || secrets.SOURCE_URLS }}

    steps:
      # ===================================================
      # STEP 1 - Checkout repository
      # ===================================================

      - name: Check out repository
        uses: actions/checkout@v7

      # ===================================================
      # STEP 2 - Setup Node.js
      # ===================================================

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # ===================================================
      # STEP 3 - Install and verify FFmpeg
      # ===================================================

      - name: Install and verify FFmpeg
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends ffmpeg

          echo 'FFmpeg binary:'
          command -v ffmpeg

          ffmpeg -hide_banner -version | sed -n '1p'

          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264 >/dev/null || {
            echo 'ERROR: libx264 encoder is missing'
            exit 1
          }

          ffmpeg -hide_banner -encoders 2>/dev/null | grep ' aac ' >/dev/null || {
            echo 'ERROR: AAC encoder is missing'
            exit 1
          }

      # ===================================================
      # STEP 4 - Validate JavaScript and inputs
      # ===================================================

      - name: Validate script and media source configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f stream.js || {
            echo 'ERROR: stream.js is missing from repository root'
            exit 1
          }

          node --version

          node --check stream.js

          if [ -z "${SOURCE_URLS:-}" ]; then
            echo 'ERROR: Supply target_urls when running workflow, or set SOURCE_URLS under repository Actions secrets.'
            exit 1
          fi

          echo 'JavaScript syntax passed; media sources configured.'

      # ===================================================
      # STEP 5 - Test FFmpeg codecs
      # ===================================================

      - name: Run codec self-test
        run: node stream.js --self-test

      # ===================================================
      # STEP 6 - Launch streaming engine
      # ===================================================

      - name: Launch FFmpeg stream engine
        run: node stream.js
