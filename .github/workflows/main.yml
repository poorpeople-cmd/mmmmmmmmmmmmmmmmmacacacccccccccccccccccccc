
name: Browser Webpage Relay

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Normal website/player webpage URL (https://example.org/watch)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: browser-relay-${{ github.repository }}
  cancel-in-progress: false

jobs:
  webpage-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 345

    env:
      TARGET_URL: ${{ inputs.target_url }}

      # Change these defaults here, not in workflow inputs.
      OKRU_STREAM_ID: '1'
      STREAM_QUALITY: '720p'
      DURATION_MINUTES: '60'

      PULSE_SINK: stream_sink
      XDG_RUNTIME_DIR: ${{ runner.temp }}/pulse-runtime

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install browser-capture dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth openbox pulseaudio pulseaudio-utils \
            libnss3 libgbm1 libasound2t64 libatk1.0-0t64 \
            libatk-bridge2.0-0t64 libxcomposite1 libxdamage1 \
            libxrandr2 libx11-xcb1 libpangocairo-1.0-0 \
            libatspi2.0-0t64 libcups2t64

          command -v ffmpeg
          command -v Xvfb

          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          ffmpeg -hide_banner -devices 2>/dev/null | grep -q x11grab
          ffmpeg -hide_banner -devices 2>/dev/null | grep -q pulse

      - name: Install Puppeteer with Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail

          npm install --no-save --no-audit --no-fund puppeteer@24

          node -e "console.log(require('puppeteer').executablePath())"

      - name: Check JavaScript
        shell: bash
        run: |
          set -euo pipefail

          test -f stream.js

          node --check stream.js

          node stream.js --check

      - name: Prepare PulseAudio virtual sink
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio --start --exit-idle-time=-1 || true

          for i in {1..15}; do
            if pactl info >/dev/null 2>&1; then break; fi
            sleep 1
          done

          pactl info >/dev/null

          if ! pactl list short sinks | grep -q stream_sink; then
            pactl load-module module-null-sink \
              sink_name=stream_sink \
              sink_properties=device.description=StreamSink
          fi

          pactl set-default-sink stream_sink

          pactl list short sources | grep stream_sink.monitor

      - name: Launch webpage and capture it
        shell: bash
        run: |
          set -euo pipefail

          case "$STREAM_QUALITY" in
            360p) SIZE=640x360 ;;
            480p) SIZE=854x480 ;;
            720p) SIZE=1280x720 ;;
            1080p) SIZE=1920x1080 ;;
            *) echo 'Invalid STREAM_QUALITY'; exit 1 ;;
          esac

          xvfb-run --auto-servernum \
            --server-args="-screen 0 ${SIZE}x24 -ac -nolisten tcp" \
            bash -c 'openbox >/tmp/relay-openbox.log 2>&1 & exec node stream.js'
